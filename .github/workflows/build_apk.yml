name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Reconstruct Android Environment (v2 embedding & desugaring)
        run: |
          # حفظ الملفات المخصصة
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp -r android/app/src/main/kotlin /tmp/kotlin || true

          # إعادة توليد بنية أندرويد الحديثة
          rm -rf android
          flutter create . --platforms=android --org com.example.silent_chat_simulator

          # استعادة الإعدادات المخصصة
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/kotlin/* android/app/src/main/kotlin/ || true

          # ضبط minSdk وتفعيل Desugaring لحزمة الإشعارات تلقائياً
          python3 -c "
          import glob, re

          for f in glob.glob('android/app/build.gradle*'):
              with open(f, 'r') as fp:
                  c = fp.read()
              
              c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 23', c)
              c = re.sub(r'minSdk\s*=.*', 'minSdk = 23', c)
              
              if f.endswith('.kts'):
                  if 'isCoreLibraryDesugaringEnabled' not in c:
                      c = c.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                  if 'desugar_jdk_libs' not in c:
                      c += '\ndependencies {\n    add(\"coreLibraryDesugaring\", \"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              else:
                  if 'coreLibraryDesugaringEnabled' not in c:
                      c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                  if 'desugar_jdk_libs' not in c:
                      c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
              
              with open(f, 'w') as fp:
                  fp.write(c)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
