name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Reconstruct Android Environment (v2 embedding)
        run: |
          # حفظ الملفات المخصصة مؤقتاً
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp -r android/app/src/main/kotlin /tmp/kotlin || true

          # حذف مجلد أندرويد الناقص وإعادة بنائه كاملاً بالمعايير الحديثة
          rm -rf android
          flutter create . --platforms=android --org com.example.silent_chat_simulator

          # استعادة الإعدادات المخصصة (الصلاحيات وقفل الحماية)
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/kotlin/* android/app/src/main/kotlin/ || true

          # ضبط الحد الأدنى لنظام أندرويد ليتوافق مع البصمة والإشعارات
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
